services:
  api:
    build:
      context: .
      target: dev
    ports:
      - "3500:8000" # host port → see docs/PORTS.md
    volumes:
      - .:/app                  # full repo — edit anything on host, reload picks up src/
      - finance-db:/root/.finance
      - ./data/seed-statements:/seed:ro
    environment:
      FINANCE_DEBUG: "true"
      FINANCE_PORT: "8000"
      FINANCE_DB_URL: ""        # override for PostgreSQL: postgresql://user:pass@db:5432/finance
      FINANCE_SEED_DIR: "/seed"
      # BBD page default scenario (YAML preferred; sibling `ian.toml` used when missing)
      FINANCE_BBD_DEFAULT_YAML: "/seed/ian.yaml"
      # Merchant display overrides (git-tracked); API rewrites this on Save/Clear in Parameters
      # Budget page default allocation seed (tracked YAML; see data/budget-default-plan.yaml)
      FINANCE_BUDGET_DEFAULT_YAML: "/app/data/budget-default-plan.yaml"
      CORS_ORIGINS: "http://localhost:3501,http://localhost:3502"
      # Opt-in: set "true" to auto-seed "Starter cash-flow template" on first list for an empty month
      FINANCE_ALLOCATION_AUTO_TEMPLATE: "false"
    # Re-link editable install to mounted tree (fast when unchanged); uvicorn watches /app/src
    command: >
      sh -c "pip install -e /app --no-cache-dir -q &&
             python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3501:3501" # Vite dev server; see docs/PORTS.md
    volumes:
      - ./frontend:/app
      # Named volume so deps survive `docker compose run --rm` (anonymous volumes are removed with the container).
      - finance-web-node-modules:/app/node_modules
    environment:
      VITE_API_TARGET: "http://api:8000"
      # Headroom for `npm run build` (Vite + larger SPA chunks) inside the Node container.
      NODE_OPTIONS: "--max-old-space-size=6144"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  finance-db:
  finance-web-node-modules:
