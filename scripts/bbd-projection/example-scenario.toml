# Synthetic example scenario — illustrative round numbers only, not tuned to anyone’s life.
# Copy this file when learning the CLI:
#   cp scripts/bbd-projection/example-scenario.toml my-scenario.toml
# Uses the same keys as `--emit-default` / the API Scenario shape (typos trigger ValueError).

