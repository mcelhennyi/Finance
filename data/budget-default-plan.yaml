# Example cash-flow map (persisted with this plan when seeded). Income lands in checking; savings
# feeds checking; checking pays the Chase household card and sends a monthly sweep to brokerage cash.
cash_flow_graph:
  nodes:
    - ref: payroll
      display_name: Payroll & W-2 deposits
      kind: income_source
      institution: null
      layout_x: 260
      layout_y: 30
    - ref: checking
      display_name: Primary checking
      kind: checking
      institution: null
      layout_x: 260
      layout_y: 200
    - ref: savings
      display_name: High-yield savings
      kind: savings
      institution: null
      layout_x: 40
      layout_y: 200
    - ref: chase
      display_name: Chase (household card)
      kind: liability_surrogate
      institution: Chase
      layout_x: 480
      layout_y: 200
    - ref: brokerage
      display_name: Taxable brokerage cash
      kind: brokerage_cash
      institution: null
      layout_x: 260
      layout_y: 370
  edges:
    - ref: edge_income_to_checking
      from_ref: payroll
      to_ref: checking
      label: Direct deposit — income → checking
      amount_rule: percent_of_inflow
      fixed_amount: null
      percent_of_inflow: "100"
      cadence: monthly
      day_of_month: null
    - ref: edge_savings_to_checking
      from_ref: savings
      to_ref: checking
      label: Savings sweep → checking (example $500 / mo)
      amount_rule: fixed
      fixed_amount: "500.00"
      percent_of_inflow: null
      cadence: monthly
      day_of_month: null
    - ref: edge_checking_to_chase
      from_ref: checking
      to_ref: chase
      label: Chase card autopay from checking (example)
      amount_rule: fixed
      fixed_amount: "3000.00"
      percent_of_inflow: null
      cadence: monthly
      day_of_month: null
    - ref: edge_checking_to_brokerage
      from_ref: checking
      to_ref: brokerage
      label: Taxable investing sweep (example)
      amount_rule: fixed
      fixed_amount: "200.00"
      percent_of_inflow: null
      cadence: monthly
      day_of_month: null
